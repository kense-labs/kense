<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 380" width="680" height="380" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Naming layers and where brand is allowed</title>
<desc>Three layers: internal code identifiers should be brand-free, wire protocols are frozen compatibility contracts, and externally visible identifiers are centralized in brand.toml.</desc>
<defs><marker id="nA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#141413" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="380" rx="14" fill="#F8F6F0"/>
<g font-family="Menlo, SFMono-Regular, Consolas, monospace">
<rect x="30" y="24" width="620" height="96" rx="9" fill="#141413"/>
<text x="50" y="50" font-size="12.5" fill="#FDFCF9" text-anchor="start">L1  INTERNAL CODE IDENTIFIERS</text>
<text x="50" y="69" font-size="10.5" fill="#FDFCF9" text-anchor="start">crate · dir · module · type · alias</text>
<text x="50" y="92" font-size="10.2" fill="#FDFCF9" text-anchor="start">TODAY  aster-boot / aster_orm in 3519 .rs files</text>
<text x="50" y="110" font-size="10.2" fill="#FDFCF9" text-anchor="start">TARGET  boot / orm — zero brand literals</text>
<path d="M340 120 L340 134" fill="none" stroke="#141413" stroke-width="1.1" marker-end="url(#nA)"/>
<rect x="30" y="136" width="620" height="96" rx="9" fill="#4E60FF"/>
<text x="50" y="162" font-size="12.5" fill="#FDFCF9" text-anchor="start">L2  WIRE &amp; PERSISTENCE</text>
<text x="50" y="181" font-size="10.5" fill="#FDFCF9" text-anchor="start">URN · path · schema · event type · proto</text>
<text x="50" y="204" font-size="10.2" fill="#FDFCF9" text-anchor="start">TODAY  urn:plat:… , aster_inf_ , /v1/…</text>
<text x="50" y="222" font-size="10.2" fill="#FDFCF9" text-anchor="start">TARGET  FROZEN — alias, dual-read, single-write</text>
<path d="M340 232 L340 246" fill="none" stroke="#141413" stroke-width="1.1" marker-end="url(#nA)"/>
<rect x="30" y="248" width="620" height="96" rx="9" fill="#FDFCF9" stroke="#141413" stroke-width="1"/>
<text x="50" y="274" font-size="12.5" fill="#141413" text-anchor="start">L3  EXTERNAL IDENTITY</text>
<text x="50" y="293" font-size="10.5" fill="#7A756C" text-anchor="start">product · repo · tag · bundle id · CLI</text>
<text x="50" y="316" font-size="10.2" fill="#7A756C" text-anchor="start">TODAY  kbox / dsh-acp / KUI / towork</text>
<text x="50" y="334" font-size="10.2" fill="#7A756C" text-anchor="start">TARGET  one brand.toml + packaging/</text>
</g></svg>
