<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 230" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Vault 凭据模型</title>
<desc>三层 Scope 之下，凭据经 sealed 封存、active 激活、revoked 撤销三态，每步产生 receipt 并写入审计链，egress 注入只传引用。</desc>
<defs>
  <marker id="unified-ai-platform-architecture-05-vaultA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect x="0" y="0" width="680" height="230" rx="14" fill="#F8F6F0"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<rect x="190" y="20" width="300" height="44" rx="8" fill="#141413"/>
<text x="340" y="46" font-size="12.5" fill="#FDFCF9" text-anchor="middle">VaultScope · org / project / env</text>
<path d="M340 64 L340 88" fill="none" stroke="#141413" stroke-width="1.2" marker-end="url(#unified-ai-platform-architecture-05-vaultA)"/>
<rect x="30" y="90" width="190" height="56" rx="6" fill="#FDFCF9" stroke="#141413" stroke-width="0.9"/>
<text x="125" y="112" font-size="12.5" fill="#141413" text-anchor="middle">sealed</text>
<text x="125" y="130" font-size="11" fill="#7A756C" text-anchor="middle">materialize · 密文落盘</text>
<rect x="245" y="90" width="190" height="56" rx="6" fill="#4E60FF"/>
<text x="340" y="112" font-size="12.5" fill="#FDFCF9" text-anchor="middle">active</text>
<text x="340" y="130" font-size="11" fill="#FDFCF9" text-anchor="middle">按 scope × provider 绑定</text>
<rect x="460" y="90" width="190" height="56" rx="6" fill="#FDFCF9" stroke="#7A756C" stroke-width="0.9"/>
<text x="555" y="112" font-size="12.5" fill="#141413" text-anchor="middle">revoked</text>
<text x="555" y="130" font-size="11" fill="#7A756C" text-anchor="middle">终态 · 可审计</text>
<path d="M220 118 L243 118 M435 118 L458 118" fill="none" stroke="#141413" stroke-width="1.2" marker-end="url(#unified-ai-platform-architecture-05-vaultA)"/>
<rect x="30" y="166" width="620" height="44" rx="8" fill="#141413"/>
<text x="340" y="185" font-size="12.5" fill="#FDFCF9" text-anchor="middle">secret_ref · version · receipt → 审计链</text>
<text x="340" y="202" font-size="11" fill="#FDFCF9" text-anchor="middle">egress 注入只传引用，明文不出 Vault</text>
</g>
</svg>
