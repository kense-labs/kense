<title>必要功能六支柱</title>
<desc>一把 API Key 之下只保留六项必要能力：凭证与授权、网关与路由、计量与账单、审计与隔离、发布与回滚、控制台与 API；语义内容层、竞品对齐功能与生态市场明确不做。</desc>
