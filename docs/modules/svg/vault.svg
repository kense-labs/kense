<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 386" width="680" height="386" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Vault · module architecture</title>
<desc>第三方凭据由 Vault 保管，主 Key 只存哈希。Scope = (org, project, env)；materialize 封存密文 → apply 按 scope × provider 激活 → revoke 终态，每步产生 receipt 并写入审计链。</desc>
<defs><marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#141413" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="386" rx="14" fill="#F8F6F0"/>
<g font-family="Menlo, SFMono-Regular, Consolas, monospace">
<rect x="150" y="20" width="380" height="46" rx="8" fill="#141413"/>
<text x="340" y="50" font-size="16" fill="#FDFCF9" text-anchor="middle">Vault</text>
<rect x="130" y="86" width="420" height="46" rx="7" fill="#FDFCF9" stroke="#141413" stroke-width="0.9"/>
<text x="340" y="114" font-size="11.2" fill="#141413" text-anchor="middle">Third-party credential, never the primary key</text>
<path d="M340 132 L340 146 M128 146 L552 146" fill="none" stroke="#141413" stroke-width="1.1"/>
<path d="M128 146 L128 156" fill="none" stroke="#141413" stroke-width="1.1" marker-end="url(#arw)"/>
<path d="M340 146 L340 156" fill="none" stroke="#141413" stroke-width="1.1" marker-end="url(#arw)"/>
<path d="M552 146 L552 156" fill="none" stroke="#141413" stroke-width="1.1" marker-end="url(#arw)"/>
<rect x="30" y="158" width="196" height="92" rx="7" fill="#141413"/>
<text x="128" y="190" font-size="12.5" fill="#FDFCF9" text-anchor="middle">SEAL</text>
<text x="128" y="213" font-size="10.6" fill="#FDFCF9" text-anchor="middle">ciphertext, key_id</text>
<text x="128" y="231" font-size="10.6" fill="#FDFCF9" text-anchor="middle">version, expires_at</text>
<rect x="254" y="158" width="196" height="92" rx="7" fill="#FDFCF9" stroke="#141413" stroke-width="0.9"/>
<text x="352" y="190" font-size="12.5" fill="#141413" text-anchor="middle">ACTIVATE</text>
<text x="352" y="213" font-size="10.6" fill="#7A756C" text-anchor="middle">scope × provider</text>
<text x="352" y="231" font-size="10.6" fill="#7A756C" text-anchor="middle">apply → receipt</text>
<rect x="478" y="158" width="196" height="92" rx="7" fill="#FDFCF9" stroke="#4E60FF" stroke-width="1.2"/>
<text x="576" y="190" font-size="12.5" fill="#141413" text-anchor="middle">REVOKE</text>
<text x="576" y="213" font-size="10.6" fill="#4E60FF" text-anchor="middle">terminal state</text>
<text x="576" y="231" font-size="10.6" fill="#4E60FF" text-anchor="middle">receipt → audit</text>
<path d="M128 250 L128 266 M340 250 L340 266 M552 250 L552 266 M128 266 L552 266" fill="none" stroke="#141413" stroke-width="1.1"/>
<path d="M340 266 L340 280" fill="none" stroke="#141413" stroke-width="1.1" marker-end="url(#arw)"/>
<rect x="130" y="282" width="420" height="46" rx="7" fill="#FDFCF9" stroke="#141413" stroke-width="0.9"/>
<text x="340" y="310" font-size="11.2" fill="#141413" text-anchor="middle">secret_ref + version injected at egress</text>
<rect x="30" y="340" width="620" height="30" rx="5" fill="#4E60FF"/>
<text x="340" y="359" font-size="10.8" fill="#FDFCF9" text-anchor="middle">PLAINTEXT NEVER ENTERS SANDBOX, LOGS, WIRE OR AUDIT</text>
</g></svg>
