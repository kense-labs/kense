<title>Kense OS dependency and context map</title>
<desc>One key enters the unified gateway and fans out to six service layers. Five cross-cutting planes form a shared kernel, the developer supply chain injects immutable versions, the resource pool supplies capacity, and a blue feedback edge returns production traces from AaaS/SaaS to TaaS.</desc>
